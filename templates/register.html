<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Medical Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"/>

<style>
body {
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
  background: linear-gradient(135deg, rgb(38,51,61), rgb(50,55,65), rgb(33,33,78));
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrapper {
  display: flex;
  width: 900px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.panel-left {
  flex: 1;
  background: rgba(0,0,0,0.5);
  padding: 40px;
  text-align: center;
  color: white;
}

.panel-left img {
  width: 90px;
  margin-bottom: 20px;
}

.panel-right {
  flex: 1;
  background: rgba(0,0,0,0.4);
  padding: 40px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: none;
  background: rgba(0,0,0,0.3);
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, #52acff, #58cc71);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.error {
  color: #ff6b6b;
  margin-bottom: 10px;
}

.link {
  color: #58cc71;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- LEFT SIDE -->
  <div class="panel-left">
    <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png"/>
    <h2>Medical Chatbot</h2>
    <p>Create your account and start using AI health assistant</p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="panel-right">

    <h2 style="color:white;">Create Account</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <button type="submit">Register</button>
    </form>

    <p style="color:white;margin-top:10px;">
      Already have an account? <a href="/login" class="link">Login</a>
    </p>

  </div>

</div>

</body>
</html>
